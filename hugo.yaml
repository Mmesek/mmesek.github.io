baseURL: mmesek.github.io
title: M-Page
languageCode: en-US
canonifyurls: true
enableRobotsTXT: true
enableGitInfo: true

languages:
  en:
    languageName: English
    languageCode: "en"
    weight: 1
  pl:
    languageName: Polish
    languageCode: "pl"
    weight: 2
    contentDir: polish

theme: 
  - github.com/Mmesek/Hugo-mTheme
  - github.com/gyorb/hugo-dusk

module:
  imports:
    - path: github.com/hugomods/icons/vendors/simple-icons

googleAnalytics: G-7C702011LG
disqusShortname: 

SectionPagesMenu: main

pagination:
  pagerSize: 10

caches:
  images:
    dir: :cacheDir/images

markup:
  highlight:
    style: gruvbox  # dark themes: monokai, api, fruity, native, rrt, swapoff ... https://xyproto.github.io/splash/docs/longer/all.html

params:
  mainSections:
    - articles
    - journal
  author:
    name: Mmesek
  meta:
    description: Mms's website
  utterancesRepo: Mmesek/mmesek.github.io # Utterances is enabled when this param is set
  utterancesTheme: github-dark # Default: github-dark
  utterancesIssueTerm: pathname # Default: pathname
  kofi: mmesek
  buymeacoffee: mmesek
  cusdis: 8d85159c-8544-4a32-aba4-ff8a58c0d27e
  webmention: mmesek.github.io

privacy:
  googleAnalytics:
    respectDoNotTrack: true
  instagram:
    simple: false
  x:
    enableDNT: true
    simple: true
  vimeo:
    enableDNT: true
    simple: false
  youtube:
    privacyEnhanced: true