baseurl: mmesek.github.io
title: M-Page
languageCode: en-US
canonifyurls: true
enableRobotsTXT: true
enableGitInfo: true

languages:
  en:
    languageCode: "en"
  pl:
    languageCode: "pl"

theme: 
  - github.com/Mmesek/Hugo-mTheme
  - github.com/gyorb/hugo-dusk

module:
  imports:
    - path: github.com/hugomods/icons/vendors/simple-icons

googleAnalytics: G-7C702011LG
disqusShortname: 

SectionPagesMenu: main

pagination:
  pagerSize: 10

menu:
  bottom:
    - name: Posts
      weight: -120
      identifier: post
      url: /articles/
    - name: Tags
      weight: -110
      identifier: tag
      url: /tags/

taxonomies:
  category: "categories"
  group: "groups"
  series: "series"
  tag: "tags"

markup:
  highlight:
    style: gruvbox  # dark themes: monokai, api, fruity, native, rrt, swapoff ... https://xyproto.github.io/splash/docs/longer/all.html

params:
  mainSections:
    - articles
    - journal
  author:
    name: Mmesek
  meta:
    description: Mms's website
  utterancesRepo: Mmesek/mmesek.github.io # Utterances is enabled when this param is set
  utterancesTheme: github-dark # Default: github-dark
  utterancesIssueTerm: pathname # Default: pathname
  kofi: mmesek
  buymeacoffee: mmesek
  cusdis: 8d85159c-8544-4a32-aba4-ff8a58c0d27e
  webmention: mmesek.github.io

privacy:
  googleAnalytics:
    respectDoNotTrack: true
  instagram:
    simple: false
  x:
    enableDNT: true
    simple: true
  vimeo:
    enableDNT: true
    simple: false
  youtube:
    privacyEnhanced: true